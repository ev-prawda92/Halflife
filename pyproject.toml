[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halflife-ai"
version = "0.3.0"
description = "Measure how long a task you can trust an AI agent with."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Evan Prawda", email = "evanprawda92@gmail.com" }]
keywords = ["ai", "agents", "evaluation", "benchmark", "reliability", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
halflife = "halflife.cli:main"

[project.urls]
Homepage = "https://github.com/ev-prawda92/halflife"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
